name: Claude Code Review

# Reviews every push to a PR with .claude/commands/code-review.md and posts a
# single top-level "## Code Review" comment. /process-review reads that comment.

on:
  pull_request:
    types: [opened, synchronize, ready_for_review, reopened]

jobs:
  claude-review:
    # Draft PRs are reviewed too: the review is how a draft gets ready.
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
      issues: write
      id-token: write

    steps:
      - name: React to PR
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh api repos/${{ github.repository }}/issues/${{ github.event.pull_request.number }}/reactions \
            -f content=eyes

      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Run Claude Code Review
        id: claude-review
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          show_full_output: "true"
          prompt: '/code-review https://github.com/${{ github.repository }}/pull/${{ github.event.pull_request.number }}'
          settings: |
            {
              "permissions": {
                "allow": [
                  "Bash(git diff:*)",
                  "Bash(git log:*)",
                  "Bash(git show:*)",
                  "Bash(git status)",
                  "Bash(gh:*)",
                  "Bash(cat:*)",
                  "Bash(ls:*)",
                  "Bash(find:*)",
                  "Bash(grep:*)",
                  "Bash(head:*)",
                  "Bash(tail:*)",
                  "Bash(mkdir:*)",
                  "Bash(awk:*)",
                  "Bash(sed:*)",
                  "Bash(wc:*)",
                  "Read",
                  "Write",
                  "Glob",
                  "Grep"
                ]
              }
            }
